name: hello

functions:
  greet:
    http:
      method: GET
      path: /hello

  echo:
    dependencies:
      serde_json: {version: "1.0", default-features: true}
    http:
      method: POST
      path: /echo

  inspect:
    dependencies:
      serde_json: "1.0"
    http:
      method: GET
      path: /users/<user_id>/orders

  # Deliberately fails for manual testing: loop times out, trap panics, invalid returns a bad status.
  misbehave:
    http:
      method: GET
      path: /misbehave/<mode>
