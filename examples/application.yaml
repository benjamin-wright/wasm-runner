name: hello
path-prefix: /demo
kv: true
sql:
  enabled: true

dependencies:
  askama: {version: "0.16", default-features: false, features: [derive, alloc, config]}

functions:
  home:
    http:
      method: GET
      path: /

  sql-greet:
    http:
      method: GET
      path: /sql/hello

  counter:
    http:
      method: GET
      path: /counter

  greet:
    http:
      method: GET
      path: /hello

  echo:
    dependencies:
      serde_json: {version: "1.0", default-features: true}
    http:
      method: POST
      path: /echo

  inspect:
    dependencies:
      serde_json: "1.0"
    http:
      method: GET
      path: /users/<user_id>/orders

  # Deliberately fails for manual testing: loop times out, trap panics, invalid returns a bad status.
  misbehave:
    http:
      method: GET
      path: /misbehave/<mode>
