<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WASM Runner{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20362e; background: #f5f3ed; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 3rem, 46rem); margin: 12vh auto 4rem; }
    .eyebrow { color: #526b5e; font-size: .75rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.1; letter-spacing: -.045em; margin: 1rem 0; }
    .intro { max-width: 36rem; color: #526b5e; line-height: 1.7; }
    .card { margin-top: 2.5rem; padding: 2rem; background: #fff; border: 1px solid #dce2d8; border-radius: 1rem; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    ul { padding-left: 1.25rem; }
    li { padding: .65rem 0; line-height: 1.6; overflow-wrap: anywhere; }
    .empty { color: #526b5e; }
    footer { margin-top: 2rem; color: #526b5e; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
    <footer>A small place for a few words.</footer>
  </main>
</body>
</html>
