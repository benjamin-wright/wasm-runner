[package]
name = "wasm-runner"
version = "0.1.0"
edition = "2024"
description = "Build, deploy, and host WebAssembly HTTP applications"
publish = false

[[bin]]
name = "wr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
form_urlencoded = "1.2"
http = "0.2"
jsonc-parser = { version = "0.34", features = ["cst"] }
jsonschema = { version = "0.60", default-features = false }
rocket = { version = "0.5.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
toml = "0.9"
wasmtime = { version = "38.0.4", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "38.0.4", default-features = false, features = ["p2"] }
yaml_serde = "0.10"

[dev-dependencies]
wit-component = "0.239"

[build-dependencies]
jsonschema = { version = "0.60", default-features = false }
serde_json = "1.0"
