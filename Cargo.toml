[package]
name = "wasm-runner"
version = "0.1.0"
edition = "2024"
description = "Run local WebAssembly components as HTTP endpoints"
publish = false

[[bin]]
name = "wr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
jsonc-parser = { version = "0.34", features = ["cst"] }
jsonschema = { version = "0.60", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
yaml_serde = "0.10"

[dev-dependencies]
wit-component = "0.239"

[build-dependencies]
jsonschema = { version = "0.60", default-features = false }
serde_json = "1.0"
